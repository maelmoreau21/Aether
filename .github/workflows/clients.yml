name: Applications clientes

# Builds the client applications on every push: Android (APK), desktop (GPUI) for
# Windows, Linux and macOS, the TV shells (webOS .ipk, Tizen staged without
# signature) and the Roku channel. Each build is attached to the workflow run;
# when called by the release workflow, the files are also added to the GitHub
# Release. The iPhone, iPad and Apple TV apps are built by apple.yml.
on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'apps/android/**'
      - 'apps/desktop/**'
      - 'apps/tv/**'
      - 'apps/roku/**'
      - 'crates/client/**'
      - 'crates/client-ffi/**'
      - 'Cargo.lock'
      - '.github/workflows/clients.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/android/**'
      - 'apps/desktop/**'
      - 'apps/tv/**'
      - 'apps/roku/**'
      - 'crates/client/**'
      - 'crates/client-ffi/**'
      - 'Cargo.lock'
      - '.github/workflows/clients.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Tag of the GitHub Release the builds are attached to
        type: string
        required: false
        default: ''

concurrency:
  group: clients-${{ github.ref }}-${{ inputs.release_tag || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Installer la toolchain Rust et les cibles Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache des dépendances Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android

      - name: Configurer le NDK comme éditeur de liens
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$bin/aarch64-linux-android26-clang"
          {
            echo "ANDROID_NDK_HOME=$ndk"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android26-clang"
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android26-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$bin/x86_64-linux-android26-clang"
            echo "CC_x86_64_linux_android=$bin/x86_64-linux-android26-clang"
            echo "AR_x86_64_linux_android=$bin/llvm-ar"
          } >> "$GITHUB_ENV"

      - name: Compiler l'APK (installable, clé de débogage)
        run: sh apps/android/scripts/build.sh

      - name: Compiler l'APK et l'AAB signés (si la clé est configurée)
        env:
          KEYSTORE_BASE64: ${{ secrets.AETHER_KEYSTORE_BASE64 }}
          AETHER_KEYSTORE_PASSWORD: ${{ secrets.AETHER_KEYSTORE_PASSWORD }}
          AETHER_KEY_ALIAS: ${{ secrets.AETHER_KEY_ALIAS }}
          AETHER_KEY_PASSWORD: ${{ secrets.AETHER_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Pas de clé de signature (secret AETHER_KEYSTORE_BASE64) : seul l'APK de débogage est publié."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aether.jks"
          AETHER_KEYSTORE="$RUNNER_TEMP/aether.jks" RELEASE=1 sh apps/android/scripts/build.sh

      - name: Rassembler les fichiers
        run: |
          mkdir -p dist
          short=$(git rev-parse --short HEAD)
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk "dist/Aether-android-$short.apk"
          for file in apps/android/app/build/outputs/apk/release/*.apk apps/android/app/build/outputs/bundle/release/*.aab; do
            [ -f "$file" ] && cp "$file" "dist/Aether-android-$short-release.${file##*.}"
          done
          ls -l dist

      - name: Publier
        uses: actions/upload-artifact@v4
        with:
          name: aether-android
          path: dist/*
          retention-days: 30

  desktop:
    name: Bureau (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            archive: zip
          - name: Linux
            runner: ubuntu-latest
            archive: tar
          - name: macOS
            runner: macos-15
            archive: tar
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer la toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache des dépendances Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ matrix.name }}

      - name: Bibliothèques de GPUI (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev

      - name: Compiler aether-desktop
        run: cargo build --release --locked -p aether-desktop

      - name: Archiver (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $short = git rev-parse --short HEAD
          New-Item -ItemType Directory -Force dist, stage | Out-Null
          Copy-Item target/release/aether-desktop.exe stage/
          Copy-Item apps/desktop/README.md stage/
          Compress-Archive -Path stage/* -DestinationPath "dist/Aether-desktop-windows-x64-$short.zip"
          Get-ChildItem dist

      - name: Archiver (Linux, macOS)
        if: matrix.archive == 'tar'
        run: |
          short=$(git rev-parse --short HEAD)
          os=$(echo "${{ matrix.name }}" | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m)
          mkdir -p dist stage
          cp target/release/aether-desktop apps/desktop/README.md stage/
          tar -czf "dist/Aether-desktop-$os-$arch-$short.tar.gz" -C stage .
          ls -l dist

      - name: Publier
        uses: actions/upload-artifact@v4
        with:
          name: aether-desktop-${{ matrix.name }}
          path: dist/*
          retention-days: 30

  tv:
    name: TV (webOS, Tizen) et Roku
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Paquet webOS (.ipk)
        run: |
          npm install -g @webos-tools/cli
          sh apps/tv/scripts/package.sh webos

      - name: Coquille Tizen (à signer avec Tizen Studio)
        run: sh apps/tv/scripts/package.sh stage

      - name: Rassembler les fichiers
        run: |
          short=$(git rev-parse --short HEAD)
          mkdir -p dist
          for ipk in apps/tv/dist/*.ipk; do cp "$ipk" "dist/Aether-webos-$short.ipk"; done
          (cd apps/tv/build/tizen && zip -qr "$GITHUB_WORKSPACE/dist/Aether-tizen-unsigned-$short.zip" .)
          # Roku sideload package: the manifest must be at the root of the zip.
          (cd apps/roku && zip -qr "$GITHUB_WORKSPACE/dist/Aether-roku-$short.zip" manifest source components -x '*.md')
          ls -l dist

      - name: Publier
        uses: actions/upload-artifact@v4
        with:
          name: aether-tv
          path: dist/*
          retention-days: 30

  latest:
    # Always at the same address: Releases > "Applications clientes (develop)".
    name: Pré-version « Applications clientes (develop) »
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [android, desktop, tv]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer les fichiers
        uses: actions/download-artifact@v4
        with:
          pattern: aether-*
          path: dist
          merge-multiple: true

      - name: Remplacer la pré-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          cat > notes.md <<NOTES
          Dernières applications clientes compilées depuis \`develop\` (commit $short), remplacées à chaque push.

          - **Android** : \`Aether-android-*.apk\` (activer l'installation depuis des sources inconnues)
          - **Windows** : \`Aether-desktop-windows-*.zip\` ; **Linux** et **macOS** : \`Aether-desktop-*.tar.gz\` (installer libmpv pour la lecture)
          - **TV LG (webOS)** : \`Aether-webos-*.ipk\` ; **TV Samsung (Tizen)** : \`Aether-tizen-unsigned-*.zip\`, à signer avec Tizen Studio
          - **Roku** : \`Aether-roku-*.zip\`, à installer en mode développeur
          - **iPhone, iPad, Apple TV** : workflow Apple (apps non signées)
          NOTES
          sed -i 's/^          //' notes.md
          gh release delete apps-develop --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create apps-develop dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"             --prerelease --latest=false --title "Applications clientes (develop)" --notes-file notes.md

  attach:
    name: Ajouter à la Release
    if: ${{ inputs.release_tag }}
    needs: [android, desktop, tv]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer les fichiers
        uses: actions/download-artifact@v4
        with:
          pattern: aether-*
          path: dist
          merge-multiple: true

      - name: Joindre à la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

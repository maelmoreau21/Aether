[package]
name = "media-poc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "io-util", "time", "fs"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"


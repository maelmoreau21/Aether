name: Publication Docker GHCR

on:
  workflow_call:
    inputs:
      version:
        description: 'Version exacte SemVer à tagger (ex: 0.1.2 ou 0.2.0-beta.1)'
        required: false
        type: string
        default: ''
      series:
        description: 'Série SemVer majeure.mineure (ex: 0.1 ou 0.2)'
        required: false
        type: string
        default: ''
      is_release:
        description: 'True si déclenché depuis une release stable sur main'
        required: false
        type: boolean
        default: false
      push:
        description: 'Effectuer le push réel des images'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    # Strict : Jamais de publication sur pull_request.
    # Uniquement push direct / workflow_dispatch sur main ou develop, ou workflow_call validé.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || inputs.is_release)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta-standalone
        with:
          bake-target: runtime
          flavor: suffix=-${{ matrix.arch }},onlatest=true
          images: ghcr.io/${{ github.repository_owner }}/aether
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' && !inputs.is_release }}
            type=raw,value=latest,enable=${{ inputs.is_release }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=${{ inputs.series }},enable=${{ inputs.series != '' && inputs.is_release }}
            type=sha,format=long

      - uses: docker/metadata-action@v5
        id: meta-core
        with:
          bake-target: runtime-core
          flavor: suffix=-${{ matrix.arch }},onlatest=true
          images: ghcr.io/${{ github.repository_owner }}/aether-core
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' && !inputs.is_release }}
            type=raw,value=latest,enable=${{ inputs.is_release }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=${{ inputs.series }},enable=${{ inputs.series != '' && inputs.is_release }}
            type=sha,format=long

      - uses: docker/metadata-action@v5
        id: meta-node
        with:
          bake-target: runtime-node
          flavor: suffix=-${{ matrix.arch }},onlatest=true
          images: ghcr.io/${{ github.repository_owner }}/aether-node
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' && !inputs.is_release }}
            type=raw,value=latest,enable=${{ inputs.is_release }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=${{ inputs.series }},enable=${{ inputs.series != '' && inputs.is_release }}
            type=sha,format=long

      # One solve shares Rust/Web/FFmpeg stages across all three published images.
      - uses: docker/bake-action@v6
        id: build
        with:
          source: .
          files: |
            docker-bake.ci.hcl
            cwd://${{ steps.meta-standalone.outputs.bake-file }}
            cwd://${{ steps.meta-core.outputs.bake-file }}
            cwd://${{ steps.meta-node.outputs.bake-file }}
          # Validate every native image locally before any registry write.
          push: false
          load: true
          set: |
            runtime.cache-to=type=gha,mode=max,scope=publish-images-${{ matrix.arch }}
        env:
          GIT_BRANCH: ${{ github.ref_name }}
          MEDIA_VERSION: ${{ inputs.version }}
          TARGET_ARCH: ${{ matrix.arch }}

      - name: Vérifier les trois images (provenance, version et runtime Node)
        env:
          OWNER: ${{ github.repository_owner }}
          EXPECTED_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          for pair in aether:runtime aether-core:runtime-core aether-node:runtime-node; do
            image=${pair%:*}
            target=${pair#*:}
            # metadata-action normalizes repository names to lowercase.
            image_repo="ghcr.io/${OWNER,,}/$image"
            target_ref="${image_repo}:sha-${EXPECTED_REVISION}-${TARGET_ARCH}"
            test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "$target_ref")" = "$EXPECTED_SOURCE"
            test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$target_ref")" = "$EXPECTED_REVISION"
            output=$(docker run --rm "$target_ref" "$image" --version)
            echo "$image : $output"
            if [ -n "$EXPECTED_VERSION" ]; then
              echo "$output" | grep -F -- "$EXPECTED_VERSION"
            fi
            if [ "$target" = "runtime-node" ]; then
              docker run --rm --entrypoint sh "$target_ref" -ec '
                ffprobe -version | head -n 1 | grep -F "ffprobe version 9.0.2"
                ffmpeg -version | head -n 1 | grep -F "ffmpeg version 9.0.2"
                test -z "$(find /usr/lib -name "libav*.so*" -print -quit)"
              '
              test "$(docker inspect --format '{{.Size}}' "$target_ref")" -lt 200000000
            fi
          done

      - name: Vérifier les services et l’extraction AV1 avant tout push
        env:
          OWNER: ${{ github.repository_owner }}
          REVISION: ${{ github.sha }}
          TARGET_ARCH: ${{ matrix.arch }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 scripts/smoke-docker-images.py --arch "$TARGET_ARCH" --version "$EXPECTED_VERSION" \
            --standalone "ghcr.io/${OWNER,,}/aether:sha-${REVISION}-${TARGET_ARCH}" \
            --core "ghcr.io/${OWNER,,}/aether-core:sha-${REVISION}-${TARGET_ARCH}" \
            --node "ghcr.io/${OWNER,,}/aether-node:sha-${REVISION}-${TARGET_ARCH}" \
            --report "target/docker-publish-smoke-${TARGET_ARCH}/report.json"

      - name: Pousser uniquement les références immuables de l’architecture vérifiée
        if: inputs.push
        env:
          OWNER: ${{ github.repository_owner }}
          REVISION: ${{ github.sha }}
          TARGET_ARCH: ${{ matrix.arch }}
          METADATA_STANDALONE: ${{ steps.meta-standalone.outputs.json }}
          METADATA_CORE: ${{ steps.meta-core.outputs.json }}
          METADATA_NODE: ${{ steps.meta-node.outputs.json }}
        run: |
          set -euo pipefail
          mkdir -p "digests/$TARGET_ARCH"
          for image in aether aether-core aether-node; do
            image_repo="ghcr.io/${OWNER,,}/$image"
            target_ref="${image_repo}:sha-${REVISION}-${TARGET_ARCH}"
            docker push "$target_ref"
            digest=$(docker inspect --format '{{json .RepoDigests}}' "$target_ref" | jq -er --arg prefix "$image_repo@" '.[] | select(startswith($prefix)) | split("@")[1]' | head -n 1)
            case "$image" in
              aether) metadata=$METADATA_STANDALONE ;;
              aether-core) metadata=$METADATA_CORE ;;
              aether-node) metadata=$METADATA_NODE ;;
            esac
            jq --arg digest "$digest" --arg arch "$TARGET_ARCH" --arg revision "$REVISION" --arg image "$image" \
              '{image:$image,architecture:$arch,revision:$revision,digest:$digest,tags:.tags}' <<< "$metadata" > "digests/$TARGET_ARCH/$image.json"
          done

      - name: Sauvegarder les digests en artifact
        if: inputs.push
        uses: actions/upload-artifact@v4
        with:
          name: digest-images-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error
          retention-days: 1

      - name: Conserver les vérifications locales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-publish-smoke-${{ matrix.arch }}
          path: target/docker-publish-smoke-${{ matrix.arch }}/
          if-no-files-found: warn

  publish-manifests:
    name: Publier les manifests après les deux validations natives
    needs: [build-and-publish]
    if: inputs.push && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-images-*
          path: digests
          merge-multiple: true
      - name: Vérifier les six références et publier les trois manifests
        env:
          OWNER: ${{ github.repository_owner }}
          REVISION: ${{ github.sha }}
        run: python3 scripts/publish-multiarch-manifests.py --directory digests --owner "$OWNER" --revision "$REVISION" --publish

name: Publication Docker GHCR

on:
  workflow_call:
    inputs:
      version:
        description: 'Version exacte SemVer à tagger (ex: 0.1.2) si release'
        required: false
        type: string
        default: ''
      series:
        description: 'Série SemVer majeure.mineure (ex: 0.1) si release'
        required: false
        type: string
        default: ''
      is_release:
        description: 'True si déclenché depuis une release stable sur main'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    # Strict : Jamais de publication sur pull_request.
    # Uniquement push direct / workflow_dispatch sur main ou develop, ou workflow_call validé.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || inputs.is_release)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: aether
            target: runtime
          - image: aether-core
            target: runtime-core
          - image: aether-node
            target: runtime-node
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' && !inputs.is_release }}
            type=raw,value=latest,enable=${{ inputs.is_release || github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=${{ inputs.series }},enable=${{ inputs.series != '' }}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          build-args: |
            GIT_BRANCH=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Vérifier le téléchargement et le rattachement de l'image publiée
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          ref="${IMAGE}@${DIGEST}"
          docker pull "$ref"
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "$ref")" = "$EXPECTED_SOURCE"
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$ref")" = "$EXPECTED_REVISION"

      - name: Vérifier le runtime Node optimisé
        if: matrix.target == 'runtime-node'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          ref="${IMAGE}@${DIGEST}"
          docker run --rm --entrypoint sh "$ref" -ec '
            ffprobe -version | head -n 1 | grep -F "ffprobe version 9.0.2"
            ffmpeg -version | head -n 1 | grep -F "ffmpeg version 9.0.2"
            test -z "$(find /usr/lib -name "libav*.so*" -print -quit)"
          '
          test "$(docker inspect --format '{{.Size}}' "$ref")" -lt 200000000

      - name: Vérifier la commande version du conteneur
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          BINARY: ${{ matrix.image }}
        run: |
          set -euo pipefail
          ref="${IMAGE}@${DIGEST}"
          docker run --rm "$ref" "$BINARY" --version

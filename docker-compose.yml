# ==============================================================================
# Aether All-in-One Standalone Distribution - Docker Compose Configuration
# ==============================================================================
# Target: Synology DS1522+ (AMD Ryzen Embedded R1600 x86_64, 2C/4T, no iGPU)
#         and standard self-hosted x86_64 Linux servers.
#
# Hardware Notes (Synology DS1522+):
# - The AMD Ryzen R1600 processor has NO integrated GPU (no AMD VCN/VCE, no Intel QuickSync).
# - Do NOT add hardware devices such as '/dev/dri:/dev/dri'; doing so will cause container
#   startup failure on DSM because the device node does not exist.
# - Aether operates with zero mandatory video transcoding: direct streaming of AV1 + Opus
#   in MKV and MP4 containers.
#
# Image Tags:
# - Default: latest (${AETHER_IMAGE_PREFIX:-ghcr.io/maelmoreau21}/aether:latest) -> stable release from main
# - Development: develop (${AETHER_IMAGE_PREFIX:-ghcr.io/maelmoreau21}/aether:develop) -> latest develop branch
# - Override with AETHER_TAG env variable: AETHER_TAG=develop docker compose up -d
# - Local developer build: docker compose build OR docker compose up -d --build
#
# Operational Security & Hardening:
# - HTTP is strictly restricted to loopback origins (http://127.0.0.1:3000, http://localhost:3000,
#   http://[::1]:3000) for local development/testing on the host itself.
# - AuthState::new() explicitly rejects non-loopback HTTP origins (such as http://192.168.1.100:3000)
#   at startup (AuthConfigError::Origin) to prevent cleartext credential and session transmission.
# - Default port binding is strictly loopback ("127.0.0.1:3000:3000") so the backend is never exposed
#   in cleartext HTTP on the LAN.
# - For LAN or Internet access: Keep loopback binding "127.0.0.1:3000:3000" (or internal Docker network),
#   terminate TLS on a trusted HTTPS reverse proxy (Synology DSM Reverse Proxy, Nginx, Caddy, Traefik),
#   set MEDIA_PUBLIC_URL to your canonical HTTPS origin (e.g., https://aether.example.com or
#   https://aether.nas.lan:8443), and ensure the proxy preserves the client 'Host' header ($http_host).
# - In HTTPS mode, session cookies automatically enforce 'Secure; HttpOnly; SameSite=Strict', and all
#   protected routes validate 'Host', 'Origin', 'Sec-Fetch-Site', and 'x-csrf-token'.
# - Media volumes are mounted strictly read-only (:ro). Aether never modifies media files or metadata.
# - Persistent application state and SQLite database are stored in dedicated volume 'aether_data'.
# - Container runs as unprivileged non-root user 'aether' (UID:GID 10001:10001) with all Linux
#   capabilities dropped (cap_drop: ALL) and no-new-privileges enabled.
# - Zero default credentials: run 'docker compose exec -it aether media-bootstrap' to create
#   the initial local administrator account.
# ==============================================================================

services:
  aether:
    image: ${AETHER_IMAGE_PREFIX:-ghcr.io/maelmoreau21}/aether:${AETHER_TAG:-latest}
    build:
      context: .
      target: runtime
    container_name: aether
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1G
          pids: 200
    ports:
      # Bound strictly to host loopback. For LAN or remote access, expose via a trusted HTTPS
      # reverse proxy forwarding to 127.0.0.1:3000 and set MEDIA_PUBLIC_URL to your https:// origin.
      - "127.0.0.1:3000:3000"
    environment:
      - MEDIA_PORT=3000
      - MEDIA_BIND_ADDR=0.0.0.0
      - MEDIA_PUBLIC_URL=${MEDIA_PUBLIC_URL:-http://127.0.0.1:3000}
      - MEDIA_DB_PATH=/data/core.sqlite3
      - MEDIA_ASSETS_PATH=/data/assets
      - MEDIA_PLUGINS_PATH=/data/plugins
      - MEDIA_PREPARATION_CACHE_DIR=/data/preparation-cache
      - MEDIA_PREPARATION_CACHE_GIB=${MEDIA_PREPARATION_CACHE_GIB:-96}
      - MEDIA_PREPARATION_VIDEO_GIB=${MEDIA_PREPARATION_VIDEO_GIB:-64}
      - MEDIA_PREPARATION_AUDIO_MIB=${MEDIA_PREPARATION_AUDIO_MIB:-4096}
      - MEDIA_PREPARATION_SECONDS=${MEDIA_PREPARATION_SECONDS:-900}
      - MEDIA_DB_ENGINE=${MEDIA_DB_ENGINE:-sqlite}
      - MEDIA_DB_URL=${MEDIA_DB_URL:-}
      - MEDIA_BACKUP_DIR=/backups
      # Store the encryption key separately from archives; no fallback key is generated.
      - MEDIA_BACKUP_KEY=${MEDIA_BACKUP_KEY:-}
      - MEDIA_OIDC_ENABLED=${MEDIA_OIDC_ENABLED:-false}
      - MEDIA_OIDC_ISSUER=${MEDIA_OIDC_ISSUER:-}
      - MEDIA_OIDC_CLIENT_ID=${MEDIA_OIDC_CLIENT_ID:-}
      - MEDIA_OIDC_CLIENT_SECRET=${MEDIA_OIDC_CLIENT_SECRET:-}
      - MEDIA_OIDC_USER_GROUPS=${MEDIA_OIDC_USER_GROUPS:-}
    volumes:
      # Persistent application state, plugins & SQLite database (/data volume):
      # - Docker named volume (default: 'aether_data:/data'): Docker automatically assigns
      #   ownership to unprivileged container user 'aether' (UID:GID 10001:10001).
      # - Host bind mount on SSD/NVMe (e.g. '/volume1/docker/aether/data:/data' or '/mnt/nvme/aether/data:/data'):
      #   The host directory MUST be owned or writable by UID:GID 10001:10001:
      #     sudo chown -R 10001:10001 /path/to/data && sudo chmod 750 /path/to/data
      #   Otherwise container drops capabilities (cap_drop: ALL) and startup fails with os error 13 (Permission denied).
      - aether_data:/data
      - aether_backups:/backups
      # Media library root mounted strictly read-only (:ro).
      # On Synology DSM, set MEDIA_LIBRARY_DIR in .env or replace with /volume1/video
      - ${MEDIA_LIBRARY_DIR:-./tests/fixtures/generated}:/media:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  aether_data:
    name: aether_data
  aether_backups:
    name: aether_backups

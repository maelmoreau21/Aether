[workspace]
members = ["crates/core", "crates/node", "crates/shared", "crates/extension-sdk", "tests/fixtures/extension-sdk"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Dev/test builds: line tables only for workspace crates (backtraces keep file:line),
# no debuginfo for dependencies. Each of the ~60 integration test binaries links the
# whole Core; full debuginfo made target/debug reach hundreds of GB and slowed linking.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

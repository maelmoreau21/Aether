[package]
name = "media-node"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
media-contracts = { path = "../shared" }
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
quick-xml = "0.42.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "fs", "sync"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
tempfile = "3"

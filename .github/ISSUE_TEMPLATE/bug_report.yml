name: 🐛 Rapport de bug
description: Signaler un bug ou un dysfonctionnement vérifiable dans Aether.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler un dysfonctionnement.
        *Pour une faille de sécurité, veuillez plutôt utiliser le signalement privé conformément à [SECURITY.md](../SECURITY.md).*

  - type: textarea
    id: description
    attributes:
      label: Description du bug
      description: Résumé clair et concis de ce qui s'est produit.
      placeholder: Que s'est-il passé d'anormal ?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Étapes de reproduction
      description: Étapes précises pour reproduire le comportement observé.
      placeholder: |
        1. Lancer le serveur avec ...
        2. Ouvrir le navigateur ...
        3. Constater l'erreur ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Ce qui aurait dû se produire selon les spécifications.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environnement
      description: OS, version du navigateur, version de Rust, architecture (ex: Windows 11, Chrome 120, Linux x86_64).
      placeholder: ex. Windows 11 / Chrome 120 / Synology DSM 7.2
    validations:
      required: true

  - type: textarea
    id: media_info
    attributes:
      label: Informations sur les médias testés (si applicable)
      description: Format du conteneur (.mkv / .mp4), codecs vidéo et audio (AV1, Opus...), pistes, etc.
      placeholder: ex. MKV AV1 Main 8-bit + Opus 5.1
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs et messages d'erreur
      description: Collez ici les logs pertinents ou la sortie de la console.
      render: shell
    validations:
      required: false

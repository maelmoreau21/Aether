name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ''

# Serialize trusted version allocation through publication; PR updates cancel safely.
concurrency:
  group: ci-complete-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Preserve debug assertions and overflow checks; omit only debug symbols.
# This reduces test linking time, disk use and Cargo cache transfers.
env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  calculate-beta:
    name: Version des images avant compilation
    runs-on: ubuntu-latest
    outputs:
      has_release: ${{ steps.calc.outputs.has_release }}
      version: ${{ steps.calc.outputs.version }}
      next_tag: ${{ steps.calc.outputs.next_tag }}
      series: ${{ steps.calc.outputs.series }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: calc
        env:
          SUPPLIED_VERSION: ${{ inputs.version || '' }}
          ALLOCATE_BETA: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' }}
        run: |
          set -euo pipefail
          if [ "$ALLOCATE_BETA" != true ]; then
            echo 'has_release=false' >> "$GITHUB_OUTPUT"
            echo "version=$SUPPLIED_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/calculate_release.py --json --channel develop > beta_info.json
          cat beta_info.json
          HAS_REL=$(jq -r '.has_release' beta_info.json)
          {
            echo "has_release=$HAS_REL"
            echo "version=$(jq -r '.version // empty' beta_info.json)"
            if [ "$HAS_REL" = "true" ]; then
              echo "next_tag=$(jq -r '.next_tag' beta_info.json)"
              echo "series=$(jq -r '.series' beta_info.json)"
            fi
          } >> "$GITHUB_OUTPUT"

  workflows:
    concurrency:
      group: ci-workflows-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: Validation des workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:1.7.12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check active documentation and Halo references
        run: |
          python scripts/check_doc_references.py
          python -m unittest discover -s scripts -p test_doc_references.py
      - name: Validate manual release version policy
        run: python scripts/test-release-policy.py
      - name: Verify FFmpeg source download fallback and integrity
        run: python scripts/test-build-ffmpeg.py
      - name: Verify exact image archive identity offline
        run: python scripts/test-ci-image-archive.py
      - name: Verify disposable Docker health timeout and cleanup
        run: python scripts/test-smoke-docker-images.py
      - name: Verify multiarchitecture manifest publication gates offline
        run: python scripts/test-docker-multiarch.py
      - name: Verify compromised MDBK0001 backup key absence
        run: python scripts/test-backup-key-absence.py

  # =========================================================================
  # 1. Vérifications et tests Rust (Core & Node)
  # =========================================================================
  rust-tests:
    concurrency:
      group: ci-rust-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: Rust (${{ matrix.shard == 'checks' && 'contrôles et contrats' || format('partition {0}', matrix.shard) }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Keep the three integration partitions; run the former partition-0
        # prerequisites/contracts in parallel instead of serializing them.
        shard: [0, 1, 2, checks]
    services:
      postgres:
        image: ${{ matrix.shard == 'checks' && 'postgres:18-alpine' || '' }}
        env:
          POSTGRES_DB: media_test
          POSTGRES_USER: media_test
          POSTGRES_PASSWORD: ci-only-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U media_test -d media_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer la toolchain Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: ${{ matrix.shard == 'checks' && 'rustfmt, clippy' || '' }}
          targets: ${{ matrix.shard == 'checks' && 'wasm32-unknown-unknown' || '' }}

      - name: Vérifier le formatage (cargo fmt)
        if: matrix.shard == 'checks'
        run: cargo fmt --check

      - name: Libérer de l'espace seulement si nécessaire
        shell: bash
        run: |
          available_kb=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 {print $4}')
          echo "Available before Cargo cache: $available_kb KiB"
          # No unconditional recursive deletion (68–164 seconds in the baseline).
          # Keep headroom for all-targets linking; never delete project/cache data.
          if [ "$available_kb" -lt 20000000 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          fi
          df -h "$GITHUB_WORKSPACE"

      - name: Cache des dépendances Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          save-if: ${{ matrix.shard == 'checks' }}

      - name: Cache des fixtures synthétiques
        id: cache-fixtures
        uses: actions/cache@v4
        with:
          path: tests/fixtures/generated
          key: fixtures-p0-full-v2-ffmpeg-9.0.2-${{ hashFiles('scripts/build-ffmpeg.sh', 'scripts/generate-fixtures.ps1', 'scripts/prepare-language-remux.ps1', 'scripts/generate-representative-fixtures.py', 'scripts/prepare-mse.py', 'scripts/prepare-dash.py', 'scripts/prepare-p1.py', 'scripts/validate-prepared-fixtures.py') }}

      - name: Installer FFmpeg (requis par les tests unitaires et intégration media-node)
        uses: ./.github/actions/setup-ffmpeg

      - name: Installer les bibliothèques de l'application de bureau (WebKitGTK)
        # `--workspace` compile apps/desktop, qui affiche l'interface web dans le moteur du système.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Générer les fixtures synthétiques P0 (MKV / MP4 AV1+Opus)
        if: steps.cache-fixtures.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/generate-fixtures.ps1

      - name: Préparer le remux linguistique (pistes FR/EN)
        if: steps.cache-fixtures.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/prepare-language-remux.ps1

      - name: Générer les fixtures représentatives (10-bit / 5.1)
        if: steps.cache-fixtures.outputs.cache-hit != 'true'
        run: python3 scripts/generate-representative-fixtures.py

      - name: Préparer les segments MSE
        if: steps.cache-fixtures.outputs.cache-hit != 'true'
        run: python3 scripts/prepare-mse.py

      - name: Préparer les manifestes DASH
        if: steps.cache-fixtures.outputs.cache-hit != 'true'
        run: python3 scripts/prepare-dash.py

      - name: Prepare P1 fixture sources
        if: steps.cache-fixtures.outputs.cache-hit != 'true'
        run: python3 scripts/prepare-p1.py

      - name: Vérifier les fixtures MSE/DASH préparées, y compris après restauration du cache
        # The browser job intentionally prepares a smaller, separate fixture set.
        # Check restored caches too, before opaque HTTP 404 failures in Cargo.
        run: python3 scripts/validate-prepared-fixtures.py

      - name: Valider les métriques de comparaison des lecteurs
        if: matrix.shard == 'checks'
        run: node scripts/player-comparison-stats.test.cjs

      - name: Valider les statistiques de marge de sécurité
        if: matrix.shard == 'checks'
        run: node scripts/safe-margin-stats.test.cjs

      - name: Valider la récupération audio bornée
        if: matrix.shard == 'checks'
        run: node --test scripts/audio-seek-policy.test.cjs

      - name: Analyse statique stricte (cargo clippy)
        if: matrix.shard == 'checks'
        run: cargo clippy --locked --workspace --all-features --all-targets --timings -- -D warnings

      - name: Exécuter les tests unitaires (cargo test --lib --bins)
        if: matrix.shard == 'checks'
        # Les tests unitaires d'extensions lancent le vrai worker isolé, situé à
        # côté de target/debug/deps ; `--lib --bins` ne le produit pas seul.
        run: |
          cargo build --locked -p aether-core --all-features --bin media-extension-worker
          cargo test --locked --workspace --all-features --lib --bins --timings

      - name: Vérifier l'ABI du SDK avec un module Rust de test
        if: matrix.shard == 'checks'
        run: |
          cargo build --locked -p media-extension-sdk-fixture --target wasm32-unknown-unknown --release
          cargo test --locked --all-features -p aether-core --test extensions real_rust_sdk_module_executes -- --ignored

      - name: Exécuter les tests d'intégration (cargo test --test '*')
        if: matrix.shard != 'checks'
        # Disques/CPU séparés entre partitions. Aucun test retiré ; les tests
        # restent séquentiels au sein de chaque runner, y compris les benchmarks.
        run: python3 scripts/ci-integration-shard.py --index ${{ matrix.shard }} --count 3

      - name: Vérifier la couverture des partitions de tests
        if: matrix.shard == 'checks'
        run: python3 scripts/test-ci-integration-shard.py

      - name: Contrats PostgreSQL 18 (HTTP, OIDC, deux Nodes)
        if: matrix.shard == 'checks'
        env:
          MEDIA_TEST_POSTGRES_URL: postgres://media_test:ci-only-disposable-password@127.0.0.1:5432/media_test?sslmode=disable
        run: |
          cargo test --locked --all-features -p aether-core --test postgres -- --ignored --test-threads=1
          cargo test --locked --all-features -p aether-core --lib oidc::tests -- --test-threads=1
          cargo test --locked --all-features -p aether-core --test distributed_multi_node -- --test-threads=1

      - name: Sauvegarde et restauration PostgreSQL 18 (pg_dump 18)
        if: matrix.shard == 'checks'
        env:
          MEDIA_TEST_POSTGRES_URL: postgres://media_test:ci-only-disposable-password@127.0.0.1:5432/media_test?sslmode=disable
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          pg_dump --version
          cargo test --locked --all-features -p aether-core --test admin_postgres -- --ignored --test-threads=1

      - name: Conserver les temps de compilation Cargo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-${{ matrix.shard }}
          overwrite: true
          path: target/cargo-timings/
          if-no-files-found: ignore
          retention-days: 7

  # Keep the existing required-check name and gate publication on all partitions.
  rust:
    name: Rust (Format, Clippy, Tests)
    needs: [rust-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exiger la réussite de toutes les partitions Rust
        env:
          RESULT: ${{ needs.rust-tests.result }}
        run: test "$RESULT" = success

  # =========================================================================
  # 2. Audit de sécurité des dépendances Rust
  # =========================================================================
  security-audit:
    concurrency:
      group: ci-audit-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: Audit de sécurité (cargo audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      # cargo audit direct : échoue sur une vulnérabilité ; les crates non
      # maintenues (liaisons GTK de l'application de bureau) restent des avertissements. L'action
      # rustsec/audit-check échouait en publiant ces avertissements (« Not Found »).
      - name: Installer cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit de sécurité des dépendances RustSec
        run: cargo audit --ignore RUSTSEC-2026-0459

  # =========================================================================
  # 3. Vérifications et tests Frontend (SvelteKit)
  # Ce job s'exécutera automatiquement dès que apps/web sera initialisé.
  # =========================================================================
  frontend:
    concurrency:
      group: ci-frontend-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: Frontend SvelteKit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Installer les dépendances npm
        run: npm ci

      - name: Audit de sécurité des dépendances npm
        run: npm audit --audit-level=high

      - name: Vérification TypeScript & Svelte (svelte-check)
        run: npm run check

      - name: Linting (ESLint / Prettier)
        run: npm run lint

      - name: Tests unitaires frontend (Vitest)
        run: npm test

      - name: Build statique servi par Rust
        run: npm run build

  # =========================================================================
  # 4. Parcours navigateur réels (Films & Séries sous Chrome headless)
  # =========================================================================
  browser:
    concurrency:
      group: ci-browser-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: Navigateur Chrome (Films & Séries)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Purger les preuves navigateur préexistantes
        run: |
          rm -rf docs/evidence/2026-10-16/scanner
          rm -rf docs/evidence/2026-10-17/series
          rm -rf docs/evidence/2026-10-22/nas-preparation/ci
          rm -rf docs/evidence/2026-10-22/separated-media/ci
          rm -rf docs/evidence/2026-10-22/playlists/ci

      - name: Installer la toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache des dépendances Cargo
        uses: Swatinem/rust-cache@v2

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Installer FFmpeg (génération des fixtures et ffprobe)
        uses: ./.github/actions/setup-ffmpeg

      - name: Installer les dépendances npm du frontend
        working-directory: apps/web
        run: npm ci

      - name: Vérifier Chrome préinstallé, installer seulement si nécessaire
        run: node scripts/ci-ensure-chrome.cjs

      - name: Construire le frontend SvelteKit statique
        working-directory: apps/web
        run: |
          rm -rf build
          npm run build
          test -f build/index.html

      - name: Cache des fixtures synthétiques
        id: cache-fixtures
        uses: actions/cache@v4
        with:
          path: tests/fixtures/generated
          key: fixtures-p1-browser-v2-ffmpeg-9.0.2-${{ hashFiles('scripts/build-ffmpeg.sh', 'scripts/generate-fixtures.ps1', 'scripts/prepare-language-remux.ps1', 'scripts/generate-representative-fixtures.py', 'scripts/generate-dual-opus-fixture.py', 'scripts/prepare-p1.py') }}

      - name: Générer les fixtures synthétiques P0 (MKV / MP4 AV1+Opus)
        if: steps.cache-fixtures.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/generate-fixtures.ps1

      - name: Préparer le remux linguistique (pistes FR/EN)
        if: steps.cache-fixtures.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/prepare-language-remux.ps1

      - name: Générer les fixtures représentatives (10-bit / 5.1)
        if: steps.cache-fixtures.outputs.cache-hit != 'true'
        run: python3 scripts/generate-representative-fixtures.py

      - name: Préparer les sources P1 (clips MKV / MP4 FR/EN)
        if: steps.cache-fixtures.outputs.cache-hit != 'true'
        run: python3 scripts/prepare-p1.py

      - name: Exécuter les parcours Films et Séries (scan, lecture, redémarrage, permissions et sessions)
        env:
          # Keep generation aligned with report validation and artifact upload,
          # independently of the script's local default under target/.
          MEDIA_SCANNER_REPORT_DIR: docs/evidence/2026-10-16/scanner
        run: cargo test --locked -p aether-core --test browser_scanner --test browser_series -- --ignored --nocapture

      - name: Vérifier playlists, partage connecté, musique persistante et paroles
        env:
          MEDIA_TEST_PLAYLIST_BROWSER: '1'
          MEDIA_WEB_DIST: ${{ github.workspace }}/apps/web/build
          MEDIA_REPORT_DIR: docs/evidence/2026-10-22/playlists/ci
        run: cargo test --locked -p aether-core --lib product::tests::mixed_playlists -- --test-threads=1

      - name: Vérifier le MP4 AV1 10 bits et deux Opus 5.1 en audio segmenté
        env:
          MEDIA_TEST_SEGMENTED: '1'
          MEDIA_REPORT_DIR: docs/evidence/2026-10-22/nas-preparation/ci
        run: |
          python3 scripts/generate-dual-opus-fixture.py
          node scripts/browser-dual-opus.cjs

      - name: Validate separate MP4/WebM video and independent Opus 2.0/5.1/7.1
        run: |
          python3 scripts/generate-separated-fixtures.py
          MEDIA_TEST_FIXTURE=tests/fixtures/generated/separated-media/dual-2.mp4 MEDIA_REPORT_DIR=docs/evidence/2026-10-22/separated-media/ci/stereo node scripts/browser-dual-opus.cjs
          MEDIA_TEST_VIDEO_CONTAINER=webm MEDIA_REPORT_DIR=docs/evidence/2026-10-22/separated-media/ci/51 node scripts/browser-dual-opus.cjs
          MEDIA_TEST_SEGMENTED=1 MEDIA_TEST_VIDEO_CONTAINER=webm MEDIA_TEST_FIXTURE=tests/fixtures/generated/separated-media/dual-6.webm MEDIA_REPORT_DIR=docs/evidence/2026-10-22/separated-media/ci/webm-segmented node scripts/browser-dual-opus.cjs
          MEDIA_TEST_FIXTURE=tests/fixtures/generated/separated-media/dual-8.mp4 MEDIA_TEST_VIDEO_CONTAINER=webm MEDIA_REPORT_DIR=docs/evidence/2026-10-22/separated-media/ci/71 node scripts/browser-dual-opus.cjs

      - name: Vérifier la génération fraîche des rapports et captures navigateur
        shell: python
        run: |
          import json
          from pathlib import Path
          for file in [
              "docs/evidence/2026-10-16/scanner/report.json",
              "docs/evidence/2026-10-16/scanner/report-restart.json",
              "docs/evidence/2026-10-17/series/report.json",
              "docs/evidence/2026-10-22/nas-preparation/ci/report.json",
              "docs/evidence/2026-10-22/separated-media/ci/stereo/report.json",
              "docs/evidence/2026-10-22/separated-media/ci/51/report.json",
              "docs/evidence/2026-10-22/separated-media/ci/webm-segmented/report.json",
              "docs/evidence/2026-10-22/separated-media/ci/71/report.json",
              "docs/evidence/2026-10-22/playlists/ci/report.json"
          ]:
              assert json.loads(Path(file).read_text())["passed"] is True, file
          for img in [
              "docs/evidence/2026-10-16/scanner/scan.png",
              "docs/evidence/2026-10-16/scanner/playback.png",
              "docs/evidence/2026-10-16/scanner/playback-restart.png",
              "docs/evidence/2026-10-22/playlists/ci/music-lyrics.png",
              "docs/evidence/2026-10-22/playlists/ci/playlist-desktop.png",
              "docs/evidence/2026-10-22/playlists/ci/playlist-mobile.png",
              "docs/evidence/2026-10-22/playlists/ci/extensions-repositories.png",
              "docs/evidence/2026-10-17/series/admin-scan.png",
              "docs/evidence/2026-10-17/series/series-detail.png",
              "docs/evidence/2026-10-17/series/immersive-playback.png"
          ]:
              assert Path(img).is_file(), img

      - name: Archiver les rapports et captures navigateur
        # Keep partial failure reports, but do not mask a fixture/setup failure
        # with a second error when no browser scenario could run.
        if: ${{ always() && hashFiles('docs/evidence/2026-10-16/scanner/**', 'docs/evidence/2026-10-17/series/**', 'docs/evidence/2026-10-22/nas-preparation/ci/**', 'docs/evidence/2026-10-22/separated-media/ci/**', 'docs/evidence/2026-10-22/playlists/ci/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-films-series
          if-no-files-found: error
          path: |
            docs/evidence/2026-10-16/scanner/
            docs/evidence/2026-10-17/series/
            docs/evidence/2026-10-22/nas-preparation/ci/
            docs/evidence/2026-10-22/separated-media/ci/
            docs/evidence/2026-10-22/playlists/ci/

  images:
    needs: [calculate-beta]
    timeout-minutes: 35
    concurrency:
      group: ci-images-${{ github.ref }}-${{ matrix.arch }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: Images Docker (${{ matrix.arch }}, compilation native partagée)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/bake-action@v6
        with:
          # Bake v6 otherwise refetches the event's ephemeral PR merge ref.
          source: .
          files: docker-bake.ci.hcl
          load: true
          push: false
        env:
          GIT_BRANCH: ${{ github.ref_name }}
          TARGET_ARCH: ${{ matrix.arch }}
          MEDIA_VERSION: ${{ needs.calculate-beta.outputs.version }}
          GIT_COMMIT: ${{ github.sha }}
      - name: Vérifier le runtime Node optimisé avant publication
        run: |
          set -euo pipefail
          # Same checks, but each failure says what it found (annotations are public).
          docker run --rm --entrypoint sh media-ci:runtime-node -ec '
            ffprobe -version | head -n 1 | grep -F "ffprobe version 9.0.2"
            ffmpeg -version | head -n 1 | grep -F "ffmpeg version 9.0.2"
            found=$(find /usr/lib -name "libav*.so*" -print | tr "\n" " ")
            if [ -n "$found" ]; then
              echo "::error::runtime-node contains libav* libraries: $found"
              exit 1
            fi
          '
          size=$(docker inspect --format '{{.Size}}' media-ci:runtime-node)
          echo "runtime-node image size: $size bytes"
          if [ "$size" -ge 200000000 ]; then
            echo "::error::runtime-node image is $size bytes (limit 200000000)"
            exit 1
          fi
      - name: Réutiliser la fixture AV1/Opus des tests Rust
        id: image-fixtures
        uses: actions/cache/restore@v4
        with:
          path: tests/fixtures/generated
          key: fixtures-p0-full-v2-ffmpeg-9.0.2-${{ hashFiles('scripts/build-ffmpeg.sh', 'scripts/generate-fixtures.ps1', 'scripts/prepare-language-remux.ps1', 'scripts/generate-representative-fixtures.py', 'scripts/prepare-mse.py', 'scripts/prepare-dash.py', 'scripts/prepare-p1.py', 'scripts/validate-prepared-fixtures.py') }}
      - name: Préparer un générateur seulement si les fixtures ne sont pas en cache
        if: steps.image-fixtures.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-ffmpeg
      - name: Vérifier les trois services et une vraie image AV1 de chapitre
        # Baseline normally 21–52 s; fail a stalled apt/Docker call instead of
        # spending 27 minutes until another commit cancels the job.
        timeout-minutes: 5
        env:
          CACHED_FIXTURE: ${{ steps.image-fixtures.outputs.cache-hit }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.calculate-beta.outputs.version }}
        run: |
          set -euo pipefail
          fixture=()
          if [ "$CACHED_FIXTURE" = true ]; then
            fixture=(--fixture tests/fixtures/generated/av1-opus.mkv)
          fi
          python3 scripts/smoke-docker-images.py --arch "$ARCH" --version "$VERSION" "${fixture[@]}" --report "target/docker-smoke-$ARCH/report.json"
      - name: Archiver exactement les images validées pour la publication
        env:
          REVISION: ${{ github.sha }}
          VERSION: ${{ needs.calculate-beta.outputs.version }}
          ARCH: ${{ matrix.arch }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p verified-images
          time docker save media-ci:runtime media-ci:runtime-core media-ci:runtime-node | gzip -1 > verified-images/images.tar.gz
          python3 scripts/ci-image-archive.py record --directory verified-images \
            --revision "$REVISION" --arch "$ARCH" --version "$VERSION" --source "$SOURCE" \
            --report "target/docker-smoke-$ARCH/report.json"
          python3 scripts/ci-image-archive.py load --directory verified-images \
            --revision "$REVISION" --arch "$ARCH" --version "$VERSION" --source "$SOURCE"
      - name: Transférer les images validées sans nouvelle compilation
        uses: actions/upload-artifact@v4
        with:
          name: verified-images-${{ matrix.arch }}
          overwrite: true
          path: verified-images/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Conserver les mesures et aperçus Docker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-${{ matrix.arch }}
          overwrite: true
          path: target/docker-smoke-${{ matrix.arch }}/
          if-no-files-found: warn

  # =========================================================================
  # 5. Publication des images Docker sur GHCR
  # Push ou lancement manuel de CI (develop), après tous les contrôles.
  # Les pull requests non fiables ne publient jamais d'image.
  # =========================================================================
  tag-beta:
    name: Création du tag bêta Git
    needs: [calculate-beta, publish]
    if: needs.calculate-beta.outputs.has_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Poser le tag bêta
        env:
          TAG: ${{ needs.calculate-beta.outputs.next_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "Development beta $TAG"
            git push origin "$TAG"
          fi

  clients:
    name: Applications clientes
    needs: [calculate-beta]
    permissions:
      contents: read
    uses: ./.github/workflows/clients.yml
    with:
      version: ${{ needs.calculate-beta.outputs.version }}
    secrets: inherit

  beta-release:
    name: Pré-version GitHub de la bêta (avec les applis)
    needs: [calculate-beta, tag-beta, clients]
    if: needs.calculate-beta.outputs.has_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer les applications
        uses: actions/download-artifact@v4
        with:
          pattern: aether-*
          path: dist
          merge-multiple: true

      - name: Créer la pré-version et y joindre les applications
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.calculate-beta.outputs.next_tag }}
        run: |
          set -euo pipefail
          ls -l dist
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
              --title "Aether $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    name: Publication Docker GHCR (develop)
    needs: [workflows, rust, security-audit, frontend, browser, images, calculate-beta]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' && needs.calculate-beta.outputs.has_release == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.calculate-beta.outputs.version }}
      series: ${{ needs.calculate-beta.outputs.series }}
      is_release: false
      push: true

[package]
name = "aether-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Aether desktop application (the Core's web interface in a native window)"
publish = false

[[bin]]
name = "aether-desktop"
path = "src/main.rs"

[dependencies]
# Only to check that an address is an Aether server before opening it.
aether-client = { path = "../../crates/client" }
# Window and the system's web engine (WebView2, WKWebView, WebKitGTK): no
# browser is shipped with the application.
tao = "0.37.2"
wry = "0.57.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }

[build-dependencies]
# Windows icon resource.
embed-resource = "3"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

name: Applications clientes

# Builds the client applications: Android (APK), desktop (GPUI) for Windows
# (Setup installer and portable .zip), Linux and macOS, the TV shells (webOS .ipk, Tizen staged without signature) and the
# Roku channel, as artifacts named aether-*. CI calls it on every push and pull
# request; the beta pre-release (ci.yml) and the stable Release (release.yml)
# attach those artifacts. The iPhone, iPad and Apple TV apps are built by apple.yml.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Installer la toolchain Rust et les cibles Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache des dépendances Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android

      - name: Configurer le NDK comme éditeur de liens
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$bin/aarch64-linux-android26-clang"
          {
            echo "ANDROID_NDK_HOME=$ndk"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android26-clang"
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android26-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$bin/x86_64-linux-android26-clang"
            echo "CC_x86_64_linux_android=$bin/x86_64-linux-android26-clang"
            echo "AR_x86_64_linux_android=$bin/llvm-ar"
          } >> "$GITHUB_ENV"

      - name: Compiler l'APK (installable, clé de débogage)
        run: sh apps/android/scripts/build.sh

      - name: Compiler l'APK et l'AAB signés (si la clé est configurée)
        env:
          KEYSTORE_BASE64: ${{ secrets.AETHER_KEYSTORE_BASE64 }}
          AETHER_KEYSTORE_PASSWORD: ${{ secrets.AETHER_KEYSTORE_PASSWORD }}
          AETHER_KEY_ALIAS: ${{ secrets.AETHER_KEY_ALIAS }}
          AETHER_KEY_PASSWORD: ${{ secrets.AETHER_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Pas de clé de signature (secret AETHER_KEYSTORE_BASE64) : seul l'APK de débogage est publié."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aether.jks"
          AETHER_KEYSTORE="$RUNNER_TEMP/aether.jks" RELEASE=1 sh apps/android/scripts/build.sh

      - name: Rassembler les fichiers
        run: |
          mkdir -p dist
          short=$(git rev-parse --short HEAD)
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk "dist/Aether-android-$short.apk"
          for file in apps/android/app/build/outputs/apk/release/*.apk apps/android/app/build/outputs/bundle/release/*.aab; do
            [ -f "$file" ] && cp "$file" "dist/Aether-android-$short-release.${file##*.}"
          done
          ls -l dist

      - name: Publier
        uses: actions/upload-artifact@v4
        with:
          name: aether-android
          path: dist/*
          retention-days: 30

  desktop:
    name: Bureau (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            archive: zip
          - name: Linux
            runner: ubuntu-latest
            archive: tar
          - name: macOS
            runner: macos-15
            archive: tar
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer la toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache des dépendances Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ matrix.name }}

      - name: Bibliothèques de GPUI (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev

      - name: Compiler aether-desktop
        run: cargo build --release --locked -p aether-desktop

      - name: Archiver (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $short = git rev-parse --short HEAD

          # GPUI loads icon resource 1 for the window (title bar, taskbar):
          # fail the build if the executable does not carry it.
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class IconCheck {
            [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
            static extern IntPtr LoadLibraryExW(string file, IntPtr handle, uint flags);
            [DllImport("kernel32.dll", SetLastError = true)]
            static extern IntPtr FindResourceW(IntPtr module, IntPtr name, IntPtr type);
            public static bool HasWindowIcon(string path) {
              IntPtr module = LoadLibraryExW(path, IntPtr.Zero, 0x22);
              if (module == IntPtr.Zero) throw new Exception("cannot open " + path);
              return FindResourceW(module, (IntPtr)1, (IntPtr)14) != IntPtr.Zero;
            }
          }
          "@
          $exe = (Resolve-Path target/release/aether-desktop.exe).Path
          if (-not [IconCheck]::HasWindowIcon($exe)) { throw "aether-desktop.exe has no icon resource 1" }
          Write-Host "Icon resource present in aether-desktop.exe"

          New-Item -ItemType Directory -Force dist, stage | Out-Null
          Copy-Item target/release/aether-desktop.exe stage/
          Copy-Item apps/desktop/README.md stage/

          # libmpv (playback) from the shinchiro builds, placed next to the
          # executable. Without it the application still starts and explains how
          # to install it, so a failed download only warns.
          try {
            $release = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } `
              "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest"
            $asset = $release.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-\d{8}-git-.*\.7z$' } | Select-Object -First 1
            if (-not $asset) { throw "no mpv-dev-x86_64 asset in $($release.tag_name)" }
            Invoke-WebRequest $asset.browser_download_url -OutFile mpv-dev.7z
            7z e mpv-dev.7z libmpv-2.dll -ostage -y | Out-Null
            if (-not (Test-Path stage/libmpv-2.dll)) { throw "libmpv-2.dll missing from $($asset.name)" }
            Write-Host "libmpv: $($asset.name)"
          } catch {
            Write-Warning "libmpv not bundled: $_"
          }

          # Real installer (Start menu, desktop shortcut, uninstaller).
          choco install innosetup --no-progress -y | Out-Null
          $version = (Select-String -Path apps/desktop/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DStageDir=$((Resolve-Path stage).Path)" "/DAppVersion=$version-$short" "/DOutputDir=$((Resolve-Path dist).Path)" apps/desktop/installer/aether.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

          Compress-Archive -Path stage/* -DestinationPath "dist/Aether-desktop-windows-x64-$short.zip"
          Get-ChildItem dist

      - name: Archiver (Linux, macOS)
        if: matrix.archive == 'tar'
        run: |
          short=$(git rev-parse --short HEAD)
          os=$(echo "${{ matrix.name }}" | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m)
          mkdir -p dist stage
          cp target/release/aether-desktop apps/desktop/README.md stage/
          tar -czf "dist/Aether-desktop-$os-$arch-$short.tar.gz" -C stage .
          ls -l dist

      - name: Publier
        uses: actions/upload-artifact@v4
        with:
          name: aether-desktop-${{ matrix.name }}
          path: dist/*
          retention-days: 30

  tv:
    name: TV (webOS, Tizen) et Roku
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Paquet webOS (.ipk)
        run: |
          npm install -g @webos-tools/cli
          sh apps/tv/scripts/package.sh webos

      - name: Coquille Tizen (à signer avec Tizen Studio)
        run: sh apps/tv/scripts/package.sh stage

      - name: Rassembler les fichiers
        run: |
          short=$(git rev-parse --short HEAD)
          mkdir -p dist
          for ipk in apps/tv/dist/*.ipk; do cp "$ipk" "dist/Aether-webos-$short.ipk"; done
          (cd apps/tv/build/tizen && zip -qr "$GITHUB_WORKSPACE/dist/Aether-tizen-unsigned-$short.zip" .)
          # Roku sideload package: the manifest must be at the root of the zip.
          (cd apps/roku && zip -qr "$GITHUB_WORKSPACE/dist/Aether-roku-$short.zip" manifest source components -x '*.md')
          ls -l dist

      - name: Publier
        uses: actions/upload-artifact@v4
        with:
          name: aether-tv
          path: dist/*
          retention-days: 30

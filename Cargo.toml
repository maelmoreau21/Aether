[workspace]
members = ["crates/core", "crates/node", "crates/shared", "crates/extension-sdk", "crates/client", "crates/client-ffi", "apps/desktop", "tests/fixtures/extension-sdk"]
resolver = "3"
# Patched third-party sources are not workspace members (no fmt/clippy on them).
exclude = ["apps/desktop/vendor"]

[workspace.package]
edition = "2024"
rust-version = "1.99"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Dev/test builds: line tables only for workspace crates (backtraces keep file:line),
# no debuginfo for dependencies. Each of the ~60 integration test binaries links the
# whole Core; full debuginfo made target/debug reach hundreds of GB and slowed linking.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# GPUI (apps/desktop) reaches xattr 0.2 through zed-async-tar; that release no
# longer builds against libc >= 0.2.190. See apps/desktop/vendor/xattr/README.md.
# GPUI pins taffy = "=0.9.0" which pulls grid 0.18.0 (GHSA-38c5-483c-4qqp).
# apps/desktop/vendor/taffy brings taffy 0.9.2 with grid 1.0.1 under version 0.9.0.
[patch.crates-io]
xattr = { path = "apps/desktop/vendor/xattr" }
taffy = { path = "apps/desktop/vendor/taffy" }

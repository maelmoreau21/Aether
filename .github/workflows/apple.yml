name: Apple

# Builds the iPhone/iPad and Apple TV apps without signing: the Rust core as an
# XCFramework, its Swift bindings, the Xcode project (XcodeGen), then xcodebuild
# for devices and simulators, packaged as unsigned .ipa archives. Signing and
# distribution stay manual. Called by clients.yml on every CI/release run.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version du produit compilée dans les applications"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      version:
        description: "Version du produit compilée dans les applications"
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Lue par aether-client (option_env!) : vide ou absente = build de développement,
  # qui ne signale jamais de mise à jour.
  AETHER_CLIENT_VERSION: ${{ inputs.version }}

jobs:
  build:
    name: iOS, iPadOS et tvOS (sans signature)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer la toolchain Rust et les cibles Apple
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, aarch64-apple-tvos, aarch64-apple-tvos-sim

      - name: Cache des dépendances Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: apple

      - name: Versions de Xcode et SDK disponibles
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Construire le XCFramework Rust et les liaisons Swift
        run: sh apps/apple/scripts/build-xcframework.sh

      - name: Générer le projet Xcode (XcodeGen)
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          cd apps/apple && xcodegen generate

      - name: Compiler l'app iPhone et iPad (appareil)
        run: >
          xcodebuild build -project apps/apple/Aether.xcodeproj -scheme Aether
          -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath build/apple CODE_SIGNING_ALLOWED=NO

      - name: Compiler l'app iPhone et iPad (simulateur)
        run: >
          xcodebuild build -project apps/apple/Aether.xcodeproj -scheme Aether
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/apple CODE_SIGNING_ALLOWED=NO

      - name: Compiler l'app Apple TV (appareil)
        run: >
          xcodebuild build -project apps/apple/Aether.xcodeproj -scheme AetherTV
          -configuration Release -destination 'generic/platform=tvOS'
          -derivedDataPath build/apple CODE_SIGNING_ALLOWED=NO

      - name: Compiler l'app Apple TV (simulateur)
        run: >
          xcodebuild build -project apps/apple/Aether.xcodeproj -scheme AetherTV
          -configuration Debug -destination 'generic/platform=tvOS Simulator'
          -derivedDataPath build/apple CODE_SIGNING_ALLOWED=NO

      - name: Archiver les apps non signées (.ipa)
        run: |
          short=$(git rev-parse --short HEAD)
          mkdir -p dist
          for entry in "Release-iphoneos:ios" "Release-appletvos:tvos"; do
            dir="${entry%%:*}"
            platform="${entry##*:}"
            app="build/apple/Build/Products/$dir/Aether.app"
            test -d "$app"
            stage=$(mktemp -d)
            mkdir -p "$stage/Payload"
            cp -R "$app" "$stage/Payload/"
            (cd "$stage" && ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/dist/Aether-$platform-unsigned-$short.ipa")
            rm -rf "$stage"
          done
          ls -l dist

      - name: Publier les apps non signées
        uses: actions/upload-artifact@v4
        with:
          name: aether-apple
          path: dist/*.ipa
          retention-days: 30

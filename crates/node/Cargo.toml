[package]
name = "media-node"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
media-contracts = { path = "../shared" }
axum = "0.8.9"
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
quick-xml = "0.42.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "io-util", "time", "fs", "sync"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "aether-node"
path = "src/bin/aether-node.rs"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
